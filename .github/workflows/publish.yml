name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Note: no registry-url here on purpose. setup-node's registry-url writes
      # an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` + always-auth, which forces
      # token auth (with a placeholder token when none is set) and prevents OIDC
      # trusted publishing from ever being attempted.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # OIDC trusted publishing requires npm >= 11.5.1. Pinned to the 11.x
      # line: installing npm@latest over Node 24's bundled npm removed its
      # sigstore module and broke `--provenance` (2026-07, publish run #17).
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC trusted publishing.
      # A token here would override OIDC and force token auth.
      - name: Publish with provenance
        run: npm publish --provenance --access public --ignore-scripts
